name: Release images
on:
  workflow_dispatch:

permissions: {}

jobs:
  release:
    if: github.repository == 'tkasu-lab-private/ha-ml-images' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-24.04-arm
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.39.0
          cache-binary: false
          driver-opts: image=docker.io/moby/buildkit:buildx-stable-1@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build, publish and smoke-test by digest
        id: images
        run: bash scripts/build-images.sh release
      - name: Attest sync
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/tkasu-lab-private/ha-ml-images/sync
          subject-digest: ${{ steps.images.outputs.sync_digest }}
          push-to-registry: true
      - name: Attest ML
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/tkasu-lab-private/ha-ml-images/ml
          subject-digest: ${{ steps.images.outputs.ml_digest }}
          push-to-registry: true
